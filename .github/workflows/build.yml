name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-venv \
            clang llvm lld uuid-dev nasm \
            gcc-aarch64-linux-gnu acpica-tools device-tree-compiler

      - name: Build the boot image
        run: bash ./scripts/build.sh "$RUNNER_TEMP/work" RELEASE

      - name: Report
        run: |
          img=$(ls "$RUNNER_TEMP"/work/uefi/Mu-caihong-0.img)
          {
            echo "### Mu-caihong-0.img"
            echo '```'
            ls -l "$img"
            sha256sum "$img"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: Mu-caihong-RELEASE
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/work/uefi/Mu-caihong-0.img
            ${{ runner.temp }}/work/uefi/Build/caihongPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
            ${{ runner.temp }}/work/uefi/Build/BUILDLOG_caihongPkg.txt
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/work/uefi/Mu-caihong-0.img
          body: |
            caihong (OnePlus Pad Pro / OPD2404 / SM8650) UEFI firmware.

            Flash without writing anything to the tablet:

            ```
            adb reboot bootloader
            fastboot boot Mu-caihong-0.img
            ```

            Press any volume key while the logo is on screen to enter the boot
            menu, otherwise the firmware finds no boot option and powers off.
